<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Fishing Log</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{

    background:
    linear-gradient(
        180deg,
        #0f172a,
        #1e3a8a
    );

    color:white;

    min-height:100vh;

    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h1{
    font-size:2.6rem;
    margin-bottom:8px;
}

.main-card{

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    border-radius:24px;

    padding:25px;

    margin-bottom:25px;
}

.catch-button{

    width:100%;

    height:140px;

    border:none;

    border-radius:24px;

    background:
    linear-gradient(
        135deg,
        #38bdf8,
        #2563eb
    );

    color:white;

    font-size:2.5rem;

    font-weight:bold;

    cursor:pointer;
}

.form-area{
    display:none;
    margin-top:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group input,
.input-group textarea,
#fishFilter{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:
    rgba(255,255,255,0.12);

    color:white;
}

.save-button,
.export-button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:1rem;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;
}

.save-button{
    background:#22c55e;
}

.export-button{
    background:#f59e0b;
}

#map{

    height:400px;

    border-radius:20px;

    margin-bottom:25px;
}

.history-item{

    background:
    rgba(255,255,255,0.08);

    border-radius:18px;

    padding:18px;

    margin-bottom:15px;
}
.history-item h3{
    margin-bottom:15px;
}

.history-item p{
    margin-bottom:4px;
}

.delete-button{

    background:#ef4444;

    border:none;

    color:white;

    padding:8px 14px;

    border-radius:10px;

    cursor:pointer;
}

canvas{

    margin-top:15px;

    background:
    rgba(255,255,255,0.05);

    border-radius:14px;

    padding:10px;
}

a{
    color:#7dd3fc;
}

</style>
</head>

<body>

<div class="container">

<div class="title">

<h1>
🎣 Fishing Log
</h1>

</div>

<div class="main-card">

<button
class="catch-button"
id="catchButton"
>
釣れた！
</button>

<div id="loading"></div>

<div
class="form-area"
id="formArea"
>

<div class="input-group">

<input
type="text"
id="fishType"
placeholder="魚種"
>

</div>

<div class="input-group">

<input
type="number"
id="fishSize"
placeholder="サイズ(cm)"
>

</div>

<div class="input-group">

<textarea
id="memo"
placeholder="メモ"
></textarea>

</div>

<button
class="save-button"
id="saveButton"
>
保存する
</button>

</div>
</div>

<button
class="export-button"
onclick="exportCSV()"
>
CSV出力
</button>

<select id="fishFilter">

<option value="all">
すべての魚種
</option>

</select>

<div id="map"></div>

<div id="historyList"></div>

</div>

<script>

const STORMGLASS_API_KEY =
"ebd1e582-5b77-11f1-bdb4-0242ac120004-ebd1e640-5b77-11f1-bdb4-0242ac120004";

let currentCatchData = null;

let map;

let editingIndex = null;

let heatLayer;

const catchButton =
document.getElementById(
    "catchButton"
);

const formArea =
document.getElementById(
    "formArea"
);

const saveButton =
document.getElementById(
    "saveButton"
);

const historyList =
document.getElementById(
    "historyList"
);

const loading =
document.getElementById(
    "loading"
);

catchButton.addEventListener(
"click",

async () => {

    loading.innerText =
    "GPS・潮汐取得中...";

    try{

        const position =
        await getCurrentPosition();

        const lat =
        position.coords.latitude;

        const lon =
        position.coords.longitude;

        const tideData =
        await getRealTide(lat, lon);

        currentCatchData = {

            latitude:lat,

            longitude:lon,

            datetime:
            new Date().toISOString(),

            tide:tideData

        };

        loading.innerText = "";

        formArea.style.display =
        "block";

    }catch(err){

        loading.innerText = "";

        alert(
            "データ取得失敗"
        );

        console.error(err);

    }

});

saveButton.addEventListener(
"click",

() => {

    if(!currentCatchData) return;

    const fishType =
    document.getElementById(
        "fishType"
    ).value;

    const fishSize =
    document.getElementById(
        "fishSize"
    ).value;

    const memo =
    document.getElementById(
        "memo"
    ).value;

    const record = {

        ...currentCatchData,

        fishType,

        fishSize,

        memo

    };

const logs =
JSON.parse(localStorage.getItem("fishingLogs") || "[]");

if(editingIndex !== null){

    logs[editingIndex] = record;
    editingIndex = null;

}else{

    logs.unshift(record);

}

localStorage.setItem(
    "fishingLogs",
    JSON.stringify(logs)
);

    logs.unshift(record);

    localStorage.setItem(

        "fishingLogs",

        JSON.stringify(logs)

    );

    renderLogs();

    formArea.style.display =
    "none";

});

function editLog(index){

    const logs =
    JSON.parse(localStorage.getItem("fishingLogs") || "[]");

    const log = logs[index];

    document.getElementById("fishType").value = log.fishType;
    document.getElementById("fishSize").value = log.fishSize;
    document.getElementById("memo").value = log.memo;

    editingIndex = index;

    formArea.style.display = "block";
}
    
function getCurrentPosition(){

    return new Promise(
    (resolve,reject) => {

        navigator.geolocation
        .getCurrentPosition(

            resolve,

            reject,

            {
                enableHighAccuracy:true,
                timeout:10000
            }

        );

    });

}

async function getRealTide(
lat,
lon
){

    let waterTemp = "不明";

    let highTide =
    "取得失敗";

    let lowTide =
    "取得失敗";

    try{

        // ===== 水温 =====

        const weatherUrl =

        `https://api.stormglass.io/v2/weather/point` +

        `?lat=${lat}` +

        `&lng=${lon}` +

        `&params=waterTemperature`;

        const weatherResponse =

        await fetch(
            weatherUrl,
            {
                headers:{
                    Authorization:
                    STORMGLASS_API_KEY
                }
            }
        );

        const weatherData =

        await weatherResponse.json();

        if(

            weatherData.hours &&

            weatherData.hours.length > 0

        ){

            waterTemp =

            weatherData.hours[0]
            .waterTemperature?.sg

            ?? "不明";

        }

    }catch(err){

        console.error(
            "水温取得失敗",
            err
        );

    }
id="ibxq9g"
    try{

        // ===== 満潮干潮 =====

        const tideUrl =

        `https://api.stormglass.io/v2/tide/extremes/point` +

        `?lat=${lat}` +

        `&lng=${lon}`;

        const tideResponse =

        await fetch(
            tideUrl,
            {
                headers:{
                    Authorization:
                    STORMGLASS_API_KEY
                }
            }
        );

        const tideData =
        await tideResponse.json();


        const today = new Date().toDateString();

        const extremes = (tideData.data || tideData.extremes || []).filter(item => {
            return new Date(item.time).toDateString() === today;
        });
        extremes.sort((a, b) =>
    new Date(a.time) - new Date(b.time)
);

        let highList = [];
        let lowList = [];

        extremes.forEach(item => {

            const time =

            new Date(item.time)
            .toLocaleTimeString(
                "ja-JP",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

            if(item.type === "high"){

                highList.push(time);

            }else if(item.type === "low"){

                lowList.push(time);

            }

        });

        highTide =
        highList.length ? highList.join(" / ") : "データなし";

        lowTide =
        lowList.length ? lowList.join(" / ") : "データなし";

    }catch(err){

        console.error(
            "潮汐取得失敗",
            err
        );

    }

    return {

        tideName:"実潮汐",

        tideState:"取得済み",

        highTide,

        lowTide,

        waterTemp

    };

}

function generateFakeTide(){

    let data = [];

    for(let i=0;i<=24;i++){

        const v =

        50 +

        Math.sin(
            (i / 24) *
            Math.PI * 2
        ) * 40;

        data.push(v);

    }

    return data;

}

function renderLogs(){

    const allLogs = JSON.parse(
        localStorage.getItem(
            "fishingLogs"
        ) || "[]"
    );

    const fishFilter =

    document.getElementById(
        "fishFilter"
    )?.value || "all";

    const logs =

    fishFilter === "all"

    ? allLogs

    : allLogs.filter(
        log =>
        log.fishType === fishFilter
    );

    historyList.innerHTML = "";

    logs.forEach((log,index) => {

        const div =
        document.createElement(
            "div"
        );

        div.className =
        "history-item";

        div.innerHTML = `

        <h3>
        ${log.fishType}
        ${log.fishSize}cm
        </h3>

        <p>
        📅
        ${new Date(
            log.datetime
        ).toLocaleString("ja-JP")}
        </p>

        <p>
        🌡 水温：
        ${log.tide.waterTemp} ℃
        </p>

        <p>
        ⬆ 満潮：
        ${log.tide.highTide}
        </p>

        <p>
        ⬇ 干潮：
        ${log.tide.lowTide}
        </p>

        <p>
        📍

        <a
        href="https://www.google.com/maps?q=${log.latitude},${log.longitude}"
        target="_blank"
        >

        GoogleMap

        </a>

        </p>

        <p>
        📝 ${log.memo}
        </p>

        <canvas
        id="chart-${index}"
        height="120"
        ></canvas>

        <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">

        <button
        onclick="editLog(${index})"
        style="background:#28a745;color:white;border:none;padding:6px 12px;border-radius:6px;">
        編集
        </button>

        <button
        onclick="deleteLog(${index})"
        style="background:#dc3545;color:white;border:none;padding:6px 12px;border-radius:6px;">
        削除
        </button>

        </div>

        `;

        historyList.appendChild(div);

        drawTideChart(
            index,
            log
        );

    });

    renderMap(logs);

    updateFishFilter(allLogs);

}

function drawTideChart(
index,
log
){

    const ctx =

    document.getElementById(
        `chart-${index}`
    );

    if(!ctx) return;

    const labels = [];

    for(let i=0;i<=24;i++){

        labels.push(
            `${i}:00`
        );

    }

    const tideData =
    generateFakeTide();

    const catchHour =

    new Date(
        log.datetime
    ).getHours();

    const markerData =

    labels.map((_,i) => {

        if(i === catchHour){
            return 100;
        }

        return null;

    });

    new Chart(ctx, {

        type:"line",

        data:{

            labels,

            datasets:[

                {
                    label:"潮位",

                    data:tideData,

                    tension:0.4
                },

                {
                    label:"釣れた時間",

                    data:markerData,

                    pointRadius:8,

                    showLine:false
                }

            ]

        }

    });

}

function renderMap(logs){

    if(!map){

        map =

        L.map("map")
        .setView(
            [34.0,132.0],
            8
        );

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {
                attribution:
                "© OpenStreetMap"
            }

        ).addTo(map);

    }

    const heatData =

    logs.map(log => [

        log.latitude,

        log.longitude,

        1

    ]);

    if(heatLayer){
        heatLayer.remove();
    }

    heatLayer =

    L.heatLayer(
        heatData,
        {
            radius:10,
            blur:7,
            maxZoom:10
        }
    ).addTo(map);

}

function updateFishFilter(logs){

    const fishFilter =

    document.getElementById(
        "fishFilter"
    );

    const currentValue =
    fishFilter.value;

    const fishTypes = [

        ...new Set(

            logs

            .map(
                log =>
                log.fishType
            )

            .filter(type => type)

        )

    ];

    fishFilter.innerHTML = `

        <option value="all">

        すべての魚種

        </option>

    `;

    fishTypes.forEach(type => {

        fishFilter.innerHTML += `

            <option value="${type}">
            ${type}
            </option>

        `;

    });

    fishFilter.value =
    currentValue || "all";

}

function deleteLog(index){

    const logs = JSON.parse(

        localStorage.getItem(
            "fishingLogs"
        ) || "[]"

    );

    logs.splice(index,1);

    localStorage.setItem(

        "fishingLogs",

        JSON.stringify(logs)

    );

    renderLogs();

}

function exportCSV(){

    const logs = JSON.parse(

        localStorage.getItem(
            "fishingLogs"
        ) || "[]"

    );

    let csv =

    "日時,魚種,サイズ,水温,緯度,経度,メモ\n";

    logs.forEach(log => {

        csv +=

        `"${new Date(
            log.datetime
        ).toLocaleString("ja-JP")}",` +

        `"${log.fishType}",` +

        `"${log.fishSize}",` +

        `"${log.tide.waterTemp}",` +

        `"${log.latitude}",` +

        `"${log.longitude}",` +

        `"${log.memo}"\n`;

    });

    const blob =

    new Blob(
        [csv],
        {type:"text/csv"}
    );

    const link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(blob);

    link.download =
    "fishing_log.csv";

    link.click();

}

document.addEventListener(
"change",

(e) => {

    if(
        e.target.id ===
        "fishFilter"
    ){
        renderLogs();
    }

});

renderLogs();

</script>

</body>
</html>
